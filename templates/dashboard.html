<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registro</title>
    <style>
        body { font-family: Arial, sans-serif; background: linear-gradient(135deg, #4f46e5, #7c3aed); margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card { background: #fff; padding: 2rem; border-radius: 12px; width: 100%; max-width: 500px; box-shadow: 0 18px 40px rgba(0,0,0,0.2); }
        h1 { margin-top: 0; color: #312e81; text-align: center; }
        .field { margin-bottom: 1rem; }
        label { display: block; font-weight: 600; margin-bottom: 0.5rem; }
        input { width: 100%; padding: 0.8rem; border: 1px solid #d1d5db; border-radius: 8px; }
        button { width: 100%; background: linear-gradient(135deg, #4f46e5, #7c3aed); color: white; border: none; padding: 0.9rem; border-radius: 8px; font-size: 1rem; cursor: pointer; }
        .alert { display: none; margin-bottom: 1rem; padding: 0.8rem; border-radius: 8px; }
        .alert.error { background: #fee2e2; color: #b91c1c; }
        .alert.success { background: #dcfce7; color: #166534; }
        .link { margin-top: 1rem; text-align: center; }
        .link a { color: #4f46e5; text-decoration: none; }
    </style>
</head>
<body>
    <div class="card">
        <h1>📝 Criar Conta</h1>
        <div id="msg" class="alert error"></div>
        <form id="registroForm">
            <div class="field">
                <label>Username</label>
                <input type="text" id="username" required />
            </div>
            <div class="field">
                <label>Email</label>
                <input type="email" id="email" required />
            </div>
            <div class="field">
                <label>Nome completo</label>
                <input type="text" id="nome_completo" placeholder="Opcional" />
            </div>
            <div class="field">
                <label>Senha</label>
                <input type="password" id="senha" required />
            </div>
            <div class="field">
                <label>Confirmar senha</label>
                <input type="password" id="confirmacao" required />
            </div>
            <button type="submit">Registrar</button>
        </form>
        <div class="link">
            <a href="/login">Voltar para login</a>
        </div>
    </div>

    <script>
        document.getElementById('registroForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const nome_completo = document.getElementById('nome_completo').value;
            const senha = document.getElementById('senha').value;
            const confirmacao = document.getElementById('confirmacao').value;
            const msg = document.getElementById('msg');
            msg.style.display = 'none';

            if (senha !== confirmacao) {
                msg.textContent = 'As senhas não conferem';
                msg.className = 'alert error';
                msg.style.display = 'block';
                return;
            }

            try {
                const response = await fetch('/registro', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, nome_completo, senha })
                });
                const data = await response.json();
                if (response.ok && data.sucesso) {
                    msg.textContent = 'Conta criada com sucesso. Redirecionando para login...';
                    msg.className = 'alert success';
                    msg.style.display = 'block';
                    setTimeout(() => window.location.href = '/login', 1200);
                } else {
                    msg.textContent = data.mensagem || 'Erro ao registrar';
                    msg.className = 'alert error';
                    msg.style.display = 'block';
                }
            } catch (error) {
                msg.textContent = 'Erro de conexão';
                msg.className = 'alert error';
                msg.style.display = 'block';
            }
        });
    </script>
</body>
</html>
